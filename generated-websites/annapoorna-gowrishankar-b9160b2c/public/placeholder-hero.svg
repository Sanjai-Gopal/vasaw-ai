  <circle cx="600" cy="300" r="180" fill="#fbbf24" fill-opacity="0.15"/>
  <text x="600" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">
